<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Pick Outline & Wave Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="neonAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FF5E3A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Container (Squircle) -->
  <rect width="500" height="500" rx="110" fill="url(#bgGrad)" />

  <!-- Guitar Pick Body Outer Glow Track -->
  <path d="M 250 85 
           C 340 85, 410 145, 390 260 
           C 375 350, 290 415, 250 435 
           C 210 415, 125 350, 110 260 
           C 90 145, 160 85, 250 85 Z" 
        fill="#131C2E" 
        stroke="url(#neonCyan)" 
        stroke-width="5" 
        filter="url(#glow)" />

  <!-- Inner Metronome Pulse Waves (Soundwaves forming 'A') -->
  <g stroke-linecap="round" stroke-width="8">
    <!-- Center Long Pendulum / Wave -->
    <line x1="250" y1="150" x2="250" y2="370" stroke="url(#neonAmber)" filter="url(#glow)" />
    
    <!-- Left Pulses -->
    <line x1="210" y1="190" x2="210" y2="330" stroke="url(#neonCyan)" stroke-width="7" />
    <line x1="170" y1="230" x2="170" y2="290" stroke="url(#neonCyan)" stroke-width="6" opacity="0.7" />

    <!-- Right Pulses -->
    <line x1="290" y1="190" x2="290" y2="330" stroke="url(#neonCyan)" stroke-width="7" />
    <line x1="330" y1="230" x2="330" y2="290" stroke="url(#neonCyan)" stroke-width="6" opacity="0.7" />
  </g>

  <!-- Accent Pendulum Weight / Bead -->
  <circle cx="250" cy="220" r="14" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="250" cy="220" r="8" fill="#FF9500" />

  <!-- Dynamic Sonic Nodes -->
  <circle cx="250" cy="95" r="4" fill="#00F2FE" />
</svg>
