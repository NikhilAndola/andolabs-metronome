    <!-- GitHub Pages SPA Redirect Restore Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search) {
          var decoded = '';
          if (l.search[1] === '/') {
            decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&') 
            }).join('?');
          } else if (l.search.slice(1, 4) === 'p=/') {
            decoded = l.search.slice(3).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&') 
            }).join('?');
          }
          if (decoded) {
            var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            window.history.replaceState(null, null, basePath + decoded + l.hash);
          }
        }
      }(window.location))
    </script>
