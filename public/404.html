<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AndolaLabs</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var segmentCount = 0;
      var locationObj = window.location;
      locationObj.replace(
        locationObj.protocol + '//' + locationObj.hostname + (locationObj.port ? ':' + locationObj.port : '') +
        locationObj.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        locationObj.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (locationObj.search ? '&q=' + locationObj.search.slice(1).replace(/&/g, '~and~') : '') +
        locationObj.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
